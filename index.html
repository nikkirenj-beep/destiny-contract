:root{color-scheme:dark;--pink:#f5a8df;--violet:#a99bff;--ink:#080b1c;--panel:#14172c;--line:#ffffff25}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;background:radial-gradient(ellipse at 50% -20%,#39295e 0%,#0a0e22 48%,#070916 100%);color:#f9f2ff;min-height:100svh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f8b9e5;outline-offset:3px}.app{max-width:520px;min-height:100svh;margin:auto;position:relative;overflow:hidden;padding:env(safe-area-inset-top) 18px calc(26px + env(safe-area-inset-bottom));box-shadow:0 0 90px #0007}.app:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 15%,#fff9 98%,transparent),radial-gradient(1px 1px at 80% 22%,#fff8 98%,transparent),radial-gradient(2px 2px at 65% 8%,#fff9 98%,transparent),radial-gradient(1px 1px at 32% 75%,#fff8 98%,transparent),radial-gradient(1px 1px at 88% 84%,#fff8 98%,transparent);background-size:220px 280px;opacity:.5}.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;padding:14px 0}.brand{font-size:12px;letter-spacing:3px;color:#d4c4ff}.pill{border:1px solid #ffffff35;background:#ffffff12;color:white;border-radius:30px;padding:9px 13px}.scene{position:relative;z-index:1}.hero{height:min(54svh,510px);min-height:330px;border-radius:22px;overflow:hidden;position:relative;border:1px solid #a899ff55;background:linear-gradient(160deg,#191735,#353069 55%,#090c20);box-shadow:0 22px 55px #0009}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080b1d 0%,transparent 42%);pointer-events:none}.hero svg{width:100%;height:100%;display:block}.hero .overlay{position:absolute;bottom:18px;left:20px;right:20px;z-index:1}.eyebrow{font-size:11px;letter-spacing:3px;color:#e4c2ff}.main-title{font-size:clamp(38px,10vw,52px);letter-spacing:6px;margin:8px 0;text-shadow:0 0 26px #b08bff88}.sub{color:#e <template id="art"><div class="hero"><svg viewBox="0 0 390 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="银发星际指挥官洛西，站在紫色星云前的原创矢量角色插画"><defs><radialGradient id="neb"><stop stop-color="#7954c0"/><stop offset=".6" stop-color="#2d2559"/><stop offset="1" stop-color="#0d1127"/></radialGradient><linearGradient id="hair" x1="0" x2="1"><stop stop-color="#7e8cbf"/><stop offset=".4" stop-color="#f5edff"/><stop offset=".75" stop-color="#a4a6d8"/><stop offset="1" stop-color="#626c9e"/></linearGradient><linearGradient id="coat"><stop stop-color="#171a31"/><stop offset=".55" stop-color="#333049"/><stop offset="1" stop-color="#111629"/></linearGradient><linearGradient id="skin"><stop stop-color="#b78e9f"/><stop offset=".5" stop-color="#f1c5c6"/><stop offset="1" stop-color="#d49ea9"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="390" height="520" fill="url(#neb)"/><circle cx="300" cy="112" r="85" fill="#c7a3ff" opacity=".25" filter="url(#glow)"/><circle cx="300" cy="112" r="60" fill="none" stroke="#ddd0ff" opacity=".45"/><path d="M0 290Q130 180 390 240M-30 350Q180 260 420 330" fill="none" stroke="#ac93e9" stroke-width="2" opacity=".3"/><g fill="#fff" opacity=".7"><circle cx="45" cy="67" r="2"/><circle cx="338" cy="49" r="1.5"/><circle cx="89" cy="208" r="1"/><circle cx="357" cy="261" r="2"/><circle cx="34" cy="320" r="1.4"/></g><path d="M56 520Q72 367 151 340L190 315L233 338Q335 355 352 520" fill="url(#coat)" stroke="#9a8bb9" stroke-width="3"/><path d="M160 328L194 408L236 330L219 306L174 305Z" fill="#111527" stroke="#e1c5e8" stroke-width="2"/><path d="M181 272L181 332Q195 350 211 332L214 267Z" fill="url(#skin)"/><path d="M125 165Q103 98 159 71Q224 24 266 96Q295 152 261 290L296 414Q241 378 226 306L145 316Q123 389 92 416L111 254Z" fill="url(#hair)"/><path d="M135 152Q129 230 151 279Q172 314 202 310Q235 297 249 252L251 157Q207 118 135 152Z" fill="url(#skin)"/><path d="M137 201Q165 186 183 200M210 200Q230 189 247 196" fill="none" stroke="#4e3b61" stroke-width="5" stroke-linecap="round"/><path d="M153 209Q168 214 181 209M212 209Q228 215 242 208" fill="none" stroke="#b7a1f7" stroke-width="4" stroke-linecap="round"/><path d="M194 212L188 246L201 249" fill="none" stroke="#b78194" stroke-width="2"/><path d="M179 269Q198 279 216 267" fill="none" stroke="#9e627e" stroke-width="3" stroke-linecap="round"/><path d="M122 176Q112 109 150 86Q185 55 232 73Q260 84 274 143Q237 130 218 112Q184 148 123 176Z" fill="url(#hair)"/><path d="M243 95Q279 154 258 249L289 378Q258 334 244 290Z" fill="#c6c4ee"/><path d="M155 81Q119 126 111 229L88 359Q110 310 128 246Z" fill="#e2dcff"/><path d="M138 112Q165 80 207 78" stroke="#fff" opacity=".65" stroke-width="5" fill="none"/><path d="M111 382L159 348L195 410L231 347L282 386" stroke="#b6a2d6" stroke-width="3" fill="none"/><path d="M188 416L195 400L202 416L195 441Z" fill="#c6a5ff"/><path d="M68 470Q193 440 324 475" stroke="#8b73d8" stroke-width="2" opacity=".4" fill="none"/></svg><div class="overlay"><div class="eyebrow">星际恋爱 · 互动剧情</div><h1 class="main-title">命运契约</h1><div class="sub">当记忆消失，心动仍会找到归途。</div></div></div></template>
<script>
'use strict';const view=document.getElementById('view'),art=document.getElementById('art');let step='home',flags={trust:0,truth:0},audioCtx=null,playing=false,loopTimer=null,notesIndex=0;const steps=['home','meet','choice1','choice2','end'];const scenes={home:{tag:'序章 · 遗失的星光',body:'公元 2198 年，你在星港醒来，记忆一片空白。唯一的线索，是掌心一道发光的银色印记。\n\n一个银发男子穿过人群向你走来。他的眼神仿佛等待了你整整一个世纪。'},meet:{tag:'第一章 · 重逢',body:'“我叫洛西，是星际舰队的指挥官。”\n\n他握住你的手，银色印记瞬间亮起。\n\n“我们曾签下命运契约。三年前，你为了救我，亲手封印了记忆。”\n\n此刻，星港警报骤然响起。'},choice1:{tag:'第二章 · 信任的重量',body:'洛西伸出手：“追兵来了。你愿意跟我走吗？”\n\n他的声音平静，但指尖微微颤抖。你必须作出第一个选择。'},choice2:{tag:'第三章 · 最后的坐标',body:'你们抵达废弃的观星台。终端显示：解除契约，能恢复你所有的记忆，却可能让洛西失去保护你的力量。\n\n洛西轻声说：“无论你选什么，我都尊重你。”'}};const endings={love:{icon:'💗',title:'永恒星约',body:'你选择了信任，也选择共同面对未知。银色印记化作两道星光，你和洛西不再被契约束缚，而是自由地选择彼此。\n\n“这一次，我们一起走向明天。”'},truth:{icon:'✨',title:'记忆归航',body:'你解开记忆封印，终于想起：当年签订契约的人不是洛西，而是你自己。你曾主动选择保护整个星港。\n\n你决定带着真相，与洛西重新开始。'},alone:{icon:'🌙',title:'独行星海',body:'你没有将命运交给任何人。你独自驾驶星舰寻找失落的记忆。\n\n临别前，洛西将一枚星图交到你手中：“如果想回来，我永远在这里。”'}};let ending='';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function format(s){return esc(s).split('\n\n').map(x=>'<p>'+x+'</p>').join('')}function progress(){let n=steps.indexOf(step);return '<div class="progress">'+Array.from({length:5},(_,i)=>'<span class="'+(i<=n?'on':'')+'"></span>').join('')+'</div>'}function button(text,action,secondary=false){return `<button type="button" class="btn ${secondary?'secondary':''}" data-action="${action}">${text}</button>`}function render(){let html='';if(step==='home'){html=art.innerHTML+`<div class="panel"><div class="label">✦ 故事简介</div>${format(scenes.home.body)}${button('开启命运 · 开始故事','start')}${button('认识洛西 · 角色档案','profile',true)}</div>`}else if(step==='profile'){html=`<div class="panel"><div class="label">CHARACTER FILE · 001</div><h2>洛西 · 星际指挥官</h2><div class="profile-grid"><div class="avatar">✧</div><div class="stat">身份：第七星舰队指挥官<br>特征：银色长发 · 紫灰色眼眸<br>性格：克制、坚定、温柔<br>秘密：与你共享失落的过去</div></div><p>“即使宇宙将我们的记忆抹去，我也会再一次找到你。”</p>${button('返回首页','home')}</div>`}else if(step==='end'){const e=endings[ending];html=`<div class="panel"><div class="label">ENDING UNLOCKED · ${ending==='love'?'01':ending==='truth'?'02':'03'} / 03</div><div class="endicon">${e.icon}</div><h2 class="ending">${e.title}</h2>${format(e.body)}<p style="text-align:center;font-size:12px;color:#bdb0df">已解锁 ${getUnlocked().length} / 3 个结局</p>${button('再玩一次 · 解锁其他结局','restart')}${button('分享我的结局','share',true)}${button('查看角色档案','profile',true)}</div>`}else{const s=scenes[step];html=`<div class="panel"><div class="label">${s.tag}</div>${progress()}${format(s.body)}`;if(step==='meet')html+=button('继续剧情','next');if(step==='choice1')html+=`<button class="btn choice" data-action="trust">💗 握住他的手，选择相信</button><button class="btn choice" data-action="doubt">🛡️ 保持距离，要求解释</button>`;if(step==='choice2')html+=`<button class="btn choice" data-action="memory">✨ 解开封印，找回记忆</button><button class="btn choice" data-action="bond">💞 保留契约，与他并肩前行</button><button class="btn choice" data-action="leave">🌙 独自离开，寻找自己的答案</button>`;html+='</div>'}view.innerHTML=html;window.scrollTo({top:0,behavior:'instant'})}function getUnlocked(){try{return JSON.parse(localStorage.getItem('destiny-endings')||'[]')}catch{return []}}function unlock(key){let all=getUnlocked();if(!all.includes(key)){all.push(key);try{localStorage.setItem('destiny-endings',JSON.stringify(all))}catch{}}}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}view.addEventListener('click',async e=>{let b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start'){step='meet'}else if(a==='home'){step='home'}else if(a==='profile'){step='profile'}else if(a==='next'){step='choice1'}else if(a==='trust'){flags.trust=1;step='choice2'}else if(a==='doubt'){flags.trust=0;step='choice2'}else if(['memory','bond','leave'].includes(a)){ending=a==='leave'?'alone':a==='memory'?'truth':flags.trust?'love':'truth';unlock(ending);step='end'}else if(a==='restart'){flags={trust:0,truth:0};step='home'}else if(a==='share'){const txt=`我在《命运契约》中解锁了「${endings[ending].title}」结局！快来体验星际恋爱互动故事。`;if(navigator.share){try{await navigator.share({title:'命运契约',text:txt,url:location.protocol.startsWith('http')?location.href:undefined})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(txt);toast('结局文案已复制')}catch{toast(txt)}}else toast(txt);return}render()});
// Original ambient tones generated with Web Audio; no copyrighted music or external files.
const melody=[220,261.63,329.63,293.66,196,246.94,293.66,261.63];function playNote(){if(!playing||!audioCtx)return;const now=audioCtx.currentTime,f=melody[notesIndex++%melody.length];[1,1.5].forEach((m,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=i?'sine':'triangle';osc.frequency.setValueAtTime(f*m,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(i?.014:.035,now+.14);gain.gain.exponentialRampToValueAtTime(.0001,now+1.6);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+1.7)})}document.getElementById('music').addEventListener('click',async()=>{const b=document.getElementById('music');if(playing){playing=false;clearInterval(loopTimer);if(audioCtx){await audioCtx.close();audioCtx=null}b.textContent='♫ 音乐：关';b.setAttribute('aria-pressed','false');return}try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('unsupported');audioCtx=new C();await audioCtx.resume();playing=true;notesIndex=0;playNote();loopTimer=setInterval(playNote,850);b.textContent='♫ 音乐：开';b.setAttribute('aria-pressed','true')}catch{toast('当前浏览器暂不支持背景音乐')}});render();
</script></body></html>
